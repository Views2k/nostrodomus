# Nostrodomus e2e test instance (see tools/e2e/README.md).
#
# - HA_TAG selects the image tag: stable (default), beta or a version.
# - HA_STATE selects the git-ignored state directory: .ha-state (default) or
#   .ha-state-<name>. Use one per image: a newer Home Assistant migrates the
#   state, and an older one may not start from it afterwards.
# - Host port 8124 maps to the container's 8123. 8123 is left free for a Home
#   Assistant that runs on the same machine.
# - `npm run e2e:up` creates the state directory (ensure_state.mjs) before this
#   file is used, so that Docker does not create the bind source as root and
#   config/www exists when Home Assistant first starts; Home Assistant serves
#   /local/ only if config/www exists at startup.
name: nostrodomus-e2e

services:
  homeassistant:
    image: homeassistant/home-assistant:${HA_TAG:-stable}
    container_name: nostrodomus-e2e-ha
    restart: "no"
    ports:
      - "8124:8123"
    volumes:
      - ./${HA_STATE:-.ha-state}/config:/config
    environment:
      TZ: Etc/UTC
    healthcheck:
      # 200 on both the onboarding page (fresh state) and the normal frontend.
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8123/', timeout=5)",
        ]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 30s

networks:
  default:
    name: nostrodomus-e2e
