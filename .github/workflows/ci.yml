name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check module wiring
        run: npm run check:modules

      - name: Run Node tests
        run: npm test

      # The wall-clock budget tests depend on the speed of the shared runner, so
      # a failure is reported without failing the job.
      - name: Run performance budget tests (non-blocking)
        run: npm run test:perf
        continue-on-error: true

      - name: Build dist bundle
        run: python3 tools/build.py

      - name: Release-grade verification
        run: python3 tools/verify.py --release

      - name: Verify reproducible build
        run: npm run verify:reproducible

      - name: Validate snippet catalog
        run: python3 tools/validate_snippets.py
